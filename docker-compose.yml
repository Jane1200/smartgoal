version: "3.9"

services:
  backend:
    build:
      context: ./server
    env_file:
      - ./server/.env
    volumes:
      - uploads:/app/uploads
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    container_name: smartgoal-backend

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    expose:
      - "80"
    restart: unless-stopped
    container_name: smartgoal-frontend

  # Public edge / gateway Nginx.
  # - Receives all external traffic on port 80.
  # - Proxies / to the frontend Nginx container (serving the React build).
  # - Proxies /api to the backend container (Express API).
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    container_name: smartgoal-nginx

volumes:
  uploads:

